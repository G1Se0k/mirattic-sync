spring.application.name=mirattic-sync

# Secrets come from environment variables only. DB defaults match docker-compose.yml for local dev.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mirattic}
spring.datasource.username=${DB_USERNAME:mirattic}
spring.datasource.password=${DB_PASSWORD:mirattic}

# The extension (its store ID; unpacked builds get the same one from the manifest key).
app.allowed-origins=${ALLOWED_ORIGINS:chrome-extension://ffoifpjldcgdiipbhljkofgifmefgohk}
app.auth-rate-limit-per-minute=20

# Mirattic Auth (confidential client mirattic-sync). The raw client secret has no default: no start without it.
app.auth.issuer=${AUTH_ISSUER:https://auth.mirattic.com}
app.auth.client-id=mirattic-sync
app.auth.client-secret=${AUTH_CLIENT_SECRET}
app.auth.redirect-uri=${AUTH_REDIRECT_URI:https://sync.mirattic.com/auth/callback}
# Where /auth/start may hand the login back to: chrome.identity.getRedirectURL() of our extension ID(s).
app.auth.extension-redirects=${AUTH_EXTENSION_REDIRECTS:https://ffoifpjldcgdiipbhljkofgifmefgohk.chromiumapp.org/}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null

# No default in-memory user (it would print a generated password to the log).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

management.endpoints.web.exposure.include=health

# Behind Caddy: take the client IP from X-Forwarded-For, trusted only from private/loopback peers
# (Tomcat's default internal proxies). The rate limits key on it.
server.forward-headers-strategy=native
