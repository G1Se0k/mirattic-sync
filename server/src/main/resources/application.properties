spring.application.name=mirattic-sync

# Secrets come from environment variables only. DB defaults match docker-compose.yml for local dev.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mirattic}
spring.datasource.username=${DB_USERNAME:mirattic}
spring.datasource.password=${DB_PASSWORD:mirattic}
# HS256 key, >= 32 bytes. No default: the server refuses to start without it.
app.jwt-secret=${JWT_SECRET}

# Desktop (Tauri macOS/Windows + Vite dev). Add the extension origin (chrome-extension://<id>) in Phase 3.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:1420,tauri://localhost,http://tauri.localhost}
app.auth-rate-limit-per-minute=20

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.default-property-inclusion=non_null

# No default in-memory user (it would print a generated password to the log).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

management.endpoints.web.exposure.include=health
