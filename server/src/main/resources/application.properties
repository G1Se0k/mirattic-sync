spring.application.name=mirattic-sync

# Secrets come from environment variables only. Defaults match docker-compose.yml for local dev.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mirattic}
spring.datasource.username=${DB_USERNAME:mirattic}
spring.datasource.password=${DB_PASSWORD:mirattic}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No default in-memory user (it would print a generated password to the log). Real auth arrives in Phase 1.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

management.endpoints.web.exposure.include=health
