# Production stack, run from the deploy host's clone (~/Documents/mirattic-sync/deploy). Secrets live in
# deploy/.env (created once by deploy.sh, gitignored). HTTPS is terminated by the host's Caddy (deploy/Caddyfile).
name: mirattic-sync
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mirattic
      MYSQL_USER: mirattic
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 30

  server:
    image: mirattic-sync-server:current
    restart: unless-stopped
    # 4 GB host shared with Auth and Flow (about 610 MB used at idle). Heap 60% (server/Dockerfile) = 0.77 GB.
    # ponytail: the 5000-user load test ran at 2560m (docs/progress.md); raise this with a bigger host.
    mem_limit: 1280m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/mirattic
      DB_USERNAME: mirattic
      DB_PASSWORD: ${DB_PASSWORD}
      # Raw secret of the Mirattic Auth client mirattic-sync (Auth keeps only its hash).
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:8090:8080"

volumes:
  mysql-data:
