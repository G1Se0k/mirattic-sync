name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B test

  # Whether this push changes what runs on the server: the tests above run on every push, the deploy only then
  # (an extension-only push isn't redeployed). Without a known base (a new branch, a force push): deploy.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A pathspec diff, no pipe: a file moved out of server/ shows as deleted there; a git error (exit > 1) deploys.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- server deploy .github/workflows/ci.yml; then
            echo server=true >> "$GITHUB_OUTPUT"
          else
            echo server=false >> "$GITHUB_OUTPUT"
          fi

  # main only: build an image for the deploy host's platform (repo variable DEPLOY_PLATFORM: linux/amd64 on the
  # Lightsail host, arm64 by default from the Mac host days), stream it over SSH (no registry, so no credentials on
  # the host) and switch to it there.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.server == 'true'
    needs: [web, server, changes]
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      # The host is a secret, masked in the public logs, with no fallback: unset fails the deploy below rather than
      # reaching an old host. The dir and platform are repo variables (Mirattic Auth docs/deployment.md "Host move").
      HOST: ${{ secrets.DEPLOY_HOST }}
      DIR: ${{ vars.DEPLOY_DIR || 'Documents/mirattic-sync' }}
    steps:
      - run: |
          test -n "$HOST" || { echo "::error::secret DEPLOY_HOST is not set" >&2; exit 1; }
          # The secret is masked whole; an SSH error may print the host alone, so mask that too.
          echo "::add-mask::${HOST#*@}"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -DskipTests package
        working-directory: server
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/arm64' }}
          tags: mirattic-sync-server:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          # Only deploy/ is needed on the host; its gitignored .env stays (tar adds and replaces, never deletes).
          tar -cz deploy | ssh "$HOST" "mkdir -p $DIR && tar -xz -C $DIR"
          gzip -c "${{ runner.temp }}/image.tar" | ssh "$HOST" 'PATH=/opt/homebrew/bin:/usr/local/bin:$PATH docker load'
          ssh "$HOST" "sh $DIR/deploy/deploy.sh ${{ github.sha }}"
