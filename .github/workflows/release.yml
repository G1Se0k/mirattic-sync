name: Release

# Push a tag like v0.0.1: builds the extension zip into a draft release, pointing at
# https://sync.mirattic.com (.env.production). The extension is the only client.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mirattic/extension zip
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" apps/extension/.output/*.zip
        env:
          GH_TOKEN: ${{ github.token }}
