# Local development only. Production deployment is Phase 10.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mirattic
      MYSQL_USER: mirattic
      MYSQL_PASSWORD: mirattic
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data:
